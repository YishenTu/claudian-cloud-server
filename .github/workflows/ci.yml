name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify:fast

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_USER: claudian_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username claudian_test_admin --dbname postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      CLAUDIAN_TEST_POSTGRES_ADMIN_URL: postgresql://claudian_test_admin:ci-admin-password@127.0.0.1:5432/postgres
      CLAUDIAN_TEST_POSTGRES_MIGRATION_URL: postgresql://claudian_cloud_migration:ci-migration-password@127.0.0.1:5432/postgres
      CLAUDIAN_TEST_POSTGRES_RUNTIME_URL: postgresql://claudian_cloud_runtime:ci-runtime-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Provision isolated test roles
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql --set ON_ERROR_STOP=on \
            --username claudian_test_admin \
            --dbname postgres <<'SQL'
          CREATE ROLE claudian_cloud_migration LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migration-password';
          CREATE ROLE claudian_cloud_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-runtime-password';
          SQL
      - run: npm run verify:postgres

  git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify:git

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify:deployment
