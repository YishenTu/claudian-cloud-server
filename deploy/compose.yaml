name: claudian-cloud-server

x-cloud-image: &cloud-image
  image: ${CLAUDIAN_CLOUD_IMAGE:-claudian-cloud-server:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-one-shot-security: &one-shot-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  restart: "no"

x-keyring-mount: &keyring-mount
  type: bind
  source: ${CLAUDIAN_CLOUD_CLAIM_CUSTODY_KEYRING_FILE:-/etc/claudian-cloud-server/claim-custody-keyring.json}
  target: /run/secrets/claudian_claim_custody_keyring
  read_only: true

x-backup-artifact-mount: &backup-artifact-mount
  type: bind
  source: ${CLAUDIAN_CLOUD_BACKUP_ARTIFACT_ROOT:-/var/lib/claudian-cloud-server/backups/artifacts}
  target: /var/lib/claudian-cloud-backups/artifacts

x-backup-catalog-mount: &backup-catalog-mount
  type: bind
  source: ${CLAUDIAN_CLOUD_BACKUP_CATALOG_ROOT:-/var/lib/claudian-cloud-server/backups/catalogs}
  target: /var/lib/claudian-cloud-backups/catalogs

x-export-artifact-mount: &export-artifact-mount
  type: bind
  source: ${CLAUDIAN_CLOUD_EXPORT_ARTIFACT_ROOT:-/var/lib/claudian-cloud-server/exports/artifacts}
  target: /var/lib/claudian-cloud-exports/artifacts

services:
  postgres:
    image: postgres@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    network_mode: host
    env_file:
      - path: ${CLAUDIAN_CLOUD_POSTGRES_ENV_FILE:-/etc/claudian-cloud-server/postgres.env}
        required: true
    environment:
      PGPORT: ${CLAUDIAN_CLOUD_POSTGRES_PORT:-5432}
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${CLAUDIAN_CLOUD_POSTGRES_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host 127.0.0.1 --port "$${PGPORT}"
          --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  cloud-bootstrap:
    <<: *one-shot-security
    image: postgres@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    profiles:
      - bootstrap
    network_mode: host
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    env_file:
      - path: ${CLAUDIAN_CLOUD_BOOTSTRAP_ENV_FILE:-/etc/claudian-cloud-server/bootstrap.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_BOOTSTRAP_MODE: ${CLAUDIAN_CLOUD_BOOTSTRAP_MODE:-authority}
      PGPORT: ${CLAUDIAN_CLOUD_POSTGRES_PORT:-5432}
    entrypoint:
      - /bin/bash
      - /usr/local/bin/bootstrap-postgres.sh
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - ./bootstrap-postgres.sh:/usr/local/bin/bootstrap-postgres.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  cloud-migration:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - migration
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: true
    command:
      - node
      - dist/main.js
      - maintenance
      - migration

  cloud-backup:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - backup
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - backup
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - *backup-artifact-mount
      - *backup-catalog-mount
      - *keyring-mount

  cloud-verify-backup:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - verify-backup
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - verify-backup
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - <<: *backup-artifact-mount
        read_only: true
      - <<: *backup-catalog-mount
        read_only: true
      - *keyring-mount

  cloud-restore:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - restore
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - restore
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - <<: *backup-artifact-mount
        read_only: true
      - <<: *backup-catalog-mount
        read_only: true
      - *keyring-mount

  cloud-restore-recovery:
    <<: [*cloud-image, *one-shot-security]
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: false
    environment:
      CLAUDIAN_CLOUD_RESTORE_RECOVERY_REQUIRED: ${CLAUDIAN_CLOUD_RESTORE_RECOVERY_REQUIRED:-true}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ "$${CLAUDIAN_CLOUD_RESTORE_RECOVERY_REQUIRED}" != "true" ];
        then exit 0; fi;
        exec node dist/main.js maintenance recover-restore
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - <<: *backup-artifact-mount
        read_only: true
      - <<: *backup-catalog-mount
        read_only: true
      - *keyring-mount

  cloud-export-project:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - export-project
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_EXPIRES_AT: ${CLAUDIAN_CLOUD_MAINTENANCE_EXPIRES_AT:-}
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
      CLAUDIAN_CLOUD_MAINTENANCE_PROJECT_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_PROJECT_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - export-project
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - *export-artifact-mount

  cloud-reconcile-exports:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - reconcile-exports
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
    command:
      - node
      - dist/main.js
      - maintenance
      - reconcile-exports
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - *export-artifact-mount

  cloud-resume-delete:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - resume-delete
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_AUTHORIZATION_SHA256: ${CLAUDIAN_CLOUD_MAINTENANCE_AUTHORIZATION_SHA256:-}
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
      CLAUDIAN_CLOUD_MAINTENANCE_PROJECT_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_PROJECT_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - resume-delete
    volumes:
      - cloud-authority:/var/lib/claudian-cloud

  cloud-verify-authority:
    <<: [*cloud-image, *one-shot-security]
    profiles:
      - verify-authority
    network_mode: host
    user: "10001:10001"
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
      - path: ${CLAUDIAN_CLOUD_MIGRATION_ENV_FILE:-/etc/claudian-cloud-server/migration.env}
        required: true
    environment:
      CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID: ${CLAUDIAN_CLOUD_MAINTENANCE_OPERATION_ID:-}
    command:
      - node
      - dist/main.js
      - maintenance
      - verify-authority
    volumes:
      - type: volume
        source: cloud-authority
        target: /var/lib/claudian-cloud
        read_only: true
      - *keyring-mount

  cloud-server:
    <<: *cloud-image
    network_mode: host
    env_file:
      - path: ${CLAUDIAN_CLOUD_ENV_FILE:-/etc/claudian-cloud-server/server.env}
        required: true
    environment:
      NODE_ENV: production
    depends_on:
      cloud-restore-recovery:
        condition: service_completed_successfully
    volumes:
      - cloud-authority:/var/lib/claudian-cloud
      - *keyring-mount
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cpus: ${CLAUDIAN_DEPLOY_CPUS:-1.5}
    mem_limit: ${CLAUDIAN_DEPLOY_MEMORY:-1g}
    pids_limit: ${CLAUDIAN_DEPLOY_PIDS:-256}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.CLAUDIAN_CLOUD_PORT +
          '/livez').then((response) => process.exit(response.ok ? 0 :
          1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  cloud-authority:
  postgres-data:
